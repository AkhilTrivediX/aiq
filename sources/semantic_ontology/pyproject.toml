[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["semantic_ontology_query"]
package-dir = {"semantic_ontology_query" = "src"}

[project]
name = "semantic-ontology-query"
version = "1.0.0"
description = "NAT-based Semantic Ontology chat query tool — queries the Semantic Ontology assistant and forwards the user's SSO token"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat==1.8.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "aiq-agent",
]

[project.entry-points."nat.plugins"]
semantic_ontology_query = "semantic_ontology_query.register"
